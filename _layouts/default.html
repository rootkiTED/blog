<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
          <span class="brand-mark" aria-hidden="true">RT</span>
          <span>{{ site.title }}</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/cves/' | relative_url }}">CVEs</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/{{ site.github_username }}">GitHub<span class="external" aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>Research notes by Ted.</p>
        <p><span class="status-dot" aria-hidden="true"></span> Built in the open.</p>
      </div>
    </footer>
  </body>
</html>
