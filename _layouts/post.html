---
layout: default
---
<article class="post-content">
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← All field notes</a>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      <span>{{ page.categories | first | replace: '-', ' ' }}</span>
    </div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  <footer class="post-end"><span aria-hidden="true">EOF</span><a href="{{ '/' | relative_url }}">Browse all notes</a></footer>
</article>
